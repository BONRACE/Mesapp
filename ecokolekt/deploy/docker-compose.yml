# Lancer depuis la racine du projet :  docker compose -f deploy/docker-compose.yml --env-file .env up --build
# Application : http://localhost:8080   ·   API + docs : http://localhost:8080/api/docs/
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecokolekt}
      POSTGRES_USER: ${POSTGRES_USER:-ecokolekt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecokolekt}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecokolekt} -d ${POSTGRES_DB:-ecokolekt}"]
      interval: 5s
      retries: 10

  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: [../.env]
    environment:
      POSTGRES_HOST: db
    depends_on: { db: { condition: service_healthy } }
    volumes: [media:/app/media]

  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

volumes:
  pgdata:
  media:
