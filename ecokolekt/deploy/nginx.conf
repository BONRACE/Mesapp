# Sert le frontend statique et relaie /api, /admin, /static et /media vers Django (même origine : pas de CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    # Le frontend vise l'API en absolu en développement ; en production on la veut en relatif.
    sub_filter 'content="http://localhost:8000/api"' 'content="/api"';
    sub_filter_once on;

    location ~ ^/(api|admin|static|media)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ =404; }
}
