{% load static %}
<style>
  .sidebar-link { display:inline-flex; align-items:center; gap:.5rem; padding:.55rem .9rem; border-radius:.6rem;
    font-size:.85rem; color:#5B6B82; font-weight:500; white-space:nowrap; }

</style>

<!-- Barre "Tableau de Bord de l'Organisateur" — commune à toutes les pages organisateur -->

  <nav class="flex items-center gap-1 overflow-x-auto max-w-full">
    <a href="{% url 'events:organisateur_dashboard' %}" class="sidebar-link {% if actif == 'dashboard' %}active{% endif %}">
      🗓️ Mes Événements

    <a href="{% url 'events:event_create' %}" class="sidebar-link {% if actif == 'creer' %}active{% endif %}">
      📝 Créer un Événement
    </a>
    <a href="#" class="sidebar-link opacity-60 cursor-default" title="Bientôt disponible">
      📊 Rapports <span class="text-[10px]">(bientôt)</span>
    </a>
    <a href="{% url 'accounts:profile_edit' %}" class="sidebar-link {% if actif == 'profil' %}active{% endif %}">
      ⚙️ Modifier le profil
