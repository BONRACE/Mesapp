services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: salubre
      POSTGRES_PASSWORD: salubre_secret
      POSTGRES_DB: salubre_postgis
    ports:
      - "5432:5432"
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/code
    working_dir: /code
    environment:
      DATABASE_URL: postgresql+asyncpg://salubre:salubre_secret@db:5432/salubre_postgis
    ports:
      - "8000:8000"
    depends_on:
      - db
