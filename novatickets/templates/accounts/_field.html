<div {% if field.field.widget.input_type == 'checkbox' %}class="flex items-start gap-2"{% endif %}>
  {% if field.field.widget.input_type == 'checkbox' %}
    {{ field }}
    <label for="{{ field.id_for_label }}" class="text-sm text-slate-700">{{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}" class="nt-label">{{ field.label }}{% if field.field.required %} <span class="text-brand-600">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="nt-help">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="nt-error">{{ e }}</p>{% endfor %}
</div>
