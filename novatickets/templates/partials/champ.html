<div>
  <label for="{{ champ.id_for_label }}" class="mb-1.5 block text-sm font-medium text-slate-700">{{ champ.label }}{% if champ.field.required %} <span class="text-nova-600">*</span>{% endif %}</label>
  {% if type and champ.field.widget.input_type != "file" %}
    <input type="{{ type }}" name="{{ champ.html_name }}" id="{{ champ.id_for_label }}" value="{{ champ.value|default_if_none:'' }}" {% if champ.field.required %}required{% endif %} autocomplete="{% if type == 'password' %}new-password{% else %}off{% endif %}" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-900 shadow-sm outline-none transition focus:border-nova-500 focus:ring-4 focus:ring-nova-500/15">
  {% else %}
    {{ champ }}
  {% endif %}
  {% if champ.help_text %}<p class="mt-1.5 text-xs text-slate-500">{{ champ.help_text }}</p>{% endif %}
  {% for err in champ.errors %}<p class="mt-1.5 text-sm text-rose-600">{{ err }}</p>{% endfor %}
</div>
