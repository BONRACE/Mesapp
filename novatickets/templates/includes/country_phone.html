<div class="field cp" data-country-picker>
  <label>Pays et numéro de mobile</label>
  <div class="cp-phone">
    <div>
      <button type="button" class="cp-btn" aria-haspopup="listbox">
        <span class="fi fi-bj"></span><span class="cp-prefix">+229</span><span class="caret">▾</span>
      </button>
      {{ form.country }}
    </div>
    {{ form.phone }}
  </div>
  <div class="cp-panel" role="listbox">
    <input type="search" class="cp-search" placeholder="Rechercher un pays ou un indicatif…" autocomplete="off">
    <ul class="cp-list">
      {% for c in COUNTRIES %}
      <li data-code="{{ c.code }}" data-dial="{{ c.dial }}" data-name="{{ c.name|lower }}"><span class="fi fi-{{ c.code|lower }}"></span>{{ c.name }}<span class="d">+{{ c.dial }}</span></li>
      {% endfor %}
    </ul>
  </div>
  <div class="help">Numéro obligatoire — l'indicatif s'ajoute automatiquement selon le pays.</div>
  {{ form.country.errors }}{{ form.phone.errors }}
</div>
