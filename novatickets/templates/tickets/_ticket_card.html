{% load nt %}
<div class="nt-card flex flex-col overflow-hidden sm:flex-row">
  <img src="{{ t.event.visual.url }}" alt="" class="h-32 w-full object-cover sm:h-auto sm:w-40" loading="lazy">
  <div class="flex flex-1 flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between">
    <div class="min-w-0">
      <p class="truncate text-base font-bold">{{ t.event.name }}</p>
      <p class="text-sm text-slate-500">{{ t.event.start_date|date:"j M Y" }} · {{ t.event.start_time|time:"H:i" }} · {{ t.ticket_type.name }}</p>
      <p class="mt-1 text-sm">Au nom de <span class="font-semibold">{{ t.holder_name }}</span>{% if t.used_at %} <span class="nt-badge-gray ml-1">Utilisé</span>{% endif %}</p>
      <p class="mt-0.5 font-mono text-xs text-slate-400">{{ t.reference }}</p>
    </div>
    <div class="flex shrink-0 gap-2">
      <a href="{{ t.get_absolute_url }}" class="nt-btn-soft px-3.5 py-2">Voir</a>
      <a href="{% url 'tickets:pdf' t.reference %}" class="nt-btn-outline px-3.5 py-2">PDF</a>
    </div>
  </div>
</div>
