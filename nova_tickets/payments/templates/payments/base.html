<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paiement{% endblock %} — NovaTickets</title>
  {% block head %}{% endblock %}
  <style>
    :root { --g:#16a34a; --gd:#14532d; --line:#e4ebe6; --muted:#5b6b61; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f0fdf4; color:#0f1f14; }
    main { max-width: 480px; margin: 2rem auto; background:#fff; border:1px solid var(--line); border-radius:18px; padding:1.6rem; box-shadow:0 8px 24px rgba(20,83,45,.08); }
    h1 { font-size:1.5rem; color:var(--gd); text-align:center; margin:.4rem 0 1rem; }
    .muted { color:var(--muted); } .center { text-align:center; }
    .field { margin-bottom:1rem; } label { display:block; font-weight:600; font-size:.9rem; margin-bottom:.3rem; }
    input[type=text], input[type=email], input[type=number], input[type=tel] { width:100%; padding:.7rem .85rem; border:1.5px solid var(--line); border-radius:12px; font:inherit; }
    input:focus { outline:none; border-color:var(--g); box-shadow:0 0 0 4px rgba(22,163,74,.12); }
    .providers { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
    .prov { display:flex; align-items:center; gap:.5rem; border:1.5px solid var(--line); border-radius:12px; padding:.8rem; cursor:pointer; font-weight:600; }
    .prov:has(input:checked) { border-color:var(--g); background:#f0fdf4; }
    .prov input { accent-color:var(--g); }
    .btn { display:inline-block; background:var(--g); color:#fff; border:1px solid var(--g); border-radius:12px; padding:.75rem 1.2rem; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
    form > .btn { width:100%; } .btn.ghost { background:#fff; color:var(--gd); border-color:#bbf7d0; } .btn.small { padding:.4rem .8rem; font-size:.85rem; }
    .errorlist { list-style:none; margin:.3rem 0 0; padding:0; color:#b91c1c; font-size:.85rem; }
    .alert.err { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; border-radius:12px; padding:.7rem 1rem; margin-bottom:1rem; }
    .state { width:72px; height:72px; margin:0 auto .5rem; border-radius:50%; display:grid; place-items:center; font-size:2.2rem; font-weight:800; color:#fff; }
    .state.ok { background:var(--g); } .state.ko { background:#dc2626; } .state.wait { background:none; }
    .spinner { width:56px; height:56px; border:5px solid #bbf7d0; border-top-color:var(--g); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .receipt { border:1.5px dashed #86efac; border-radius:14px; padding:1rem 1.2rem; margin:1rem 0; background:#fcfffd; }
    .receipt header { display:flex; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:.6rem; margin-bottom:.6rem; color:var(--gd); }
    .receipt dl { display:grid; grid-template-columns:auto 1fr; gap:.45rem 0; margin:0; font-size:.93rem; }
    .receipt dt { color:var(--muted); } .receipt dd { margin:0; padding-left:1rem; text-align:right; font-weight:600; }
    .receipt .total { border-top:1px solid var(--line); padding-top:.6rem; font-size:1.1rem; color:var(--gd); font-weight:800; }
    .badge { background:#dcfce7; color:#166534; border-radius:99px; padding:.1rem .6rem; font-size:.8rem; }
    .dev { margin-top:1.2rem; padding:.8rem; border:1px dashed #d97706; border-radius:12px; background:#fffbeb; text-align:center; }
    @media print { body { background:#fff; } main { box-shadow:none; border:none; } .btn, .dev { display:none; } }
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
